plugins {
    id 'base'
    id 'net.fabricmc.fabric-loom' apply false
    id 'io.freefair.lombok' apply false
}

def moduleProjects = [project(':symbase'), project(':symhud'), project(':symauto')]
def releaseDir = layout.buildDirectory.dir('release').get().asFile

tasks.register('collectJars', Sync) {
    group = 'build'
    description = 'Collect only the current three mod jars into build/release'
    dependsOn moduleProjects.collect { it.tasks.named('build') }
    // 只收集各模块当前 jar 任务的产物，避免把 build/libs 里的旧版本一起复制。
    from moduleProjects.collect { it.tasks.named('jar').flatMap { task -> task.archiveFile } }
    // Sync 会删除目标目录中不再属于本次产物的旧文件，但不会删除被占用的 release 根目录。
    into layout.buildDirectory.dir('release')
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Build and collect symbase, symhud and symauto'
    dependsOn collectJars
    doLast {
        println "MOD jars: ${releaseDir}"
    }
}

tasks.named('build') {
    dependsOn buildAll
}

tasks.register('release') {
    group = 'build'
    description = 'Alias for buildAll: collect the three mod jars'
    dependsOn collectJars
}

