plugins {
    id 'net.fabricmc.fabric-loom'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = 'SymDev'
}

loom {
    splitEnvironmentSourceSets()

    runs {
        client {
            runDirectory.set(rootProject.file('run'))
        }
    }

    mods {
        "symdev" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    mavenCentral()
}

def loadMods = (findProperty('load') ?: 'symbase,symhud,symauto')
        .toString()
        .split(',')
        .collect { it.trim() }
        .findAll { !it.isEmpty() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    if (loadMods.contains('symauto')) {
        localRuntime project(':symbase')
        localRuntime project(':symauto')
    }
    if (loadMods.contains('symhud')) {
        localRuntime project(':symbase')
        localRuntime project(':symhud')
    }
    if (loadMods.contains('symbase') && !loadMods.contains('symauto') && !loadMods.contains('symhud')) {
        localRuntime project(':symbase')
    }
}

def versionValue = project.version
def minecraftVersionValue = project.minecraft_version
def loaderVersionValue = project.loader_version

processResources {
    inputs.property "version", versionValue
    inputs.property "minecraft_version", minecraftVersionValue
    inputs.property "loader_version", loaderVersionValue
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": versionValue,
                "minecraft_version": minecraftVersionValue,
                "loader_version": loaderVersionValue
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

