pluginManagement {
    plugins {
        id 'net.fabricmc.fabric-loom' version '1.17.21'
        id 'io.freefair.lombok' version '9.5.0'
    }
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
    }
}

include ':symbase'
include ':symhud'
include ':symauto'
include ':dev'
